# █▀▀ █▄░█ █░█
# ██▄ █░▀█ ▀▄▀
env = XCURSOR_SIZE,14
env = XCURSOR_THEME,Breeze
env = GTK_THEME,Catppuccin-Mocha
# env = WLR_NO_HARDWARE_CURSORS,1
env = QT_QPA_PLATFORM,wayland
# env = WLR_RENDERER_ALLOW_SOFTWARE,1

# █▀▀ ▀▄▀ █▀▀ █▀▀
# ██▄ █░█ ██▄ █▄▄
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-clip-persist --clipboard regular &
# exec-once = ~/.config/scripts/autolock &
# exec-once = ~/.config/scripts/offmonitor &
exec-once = ~/.config/scripts/battery.sh &
exec-once = awww-daemon &
exec-once = waybar &
exec-once = nm-applet &32
exec-once = udiskie -t &

# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄
monitor=LVDS-1,disable
monitor=HDMI-A-1,1360x768,0x0,1

# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░
input {
    kb_layout = es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    numlock_by_default = true
    sensitivity = 0.5
    force_no_accel = true

    touchpad {
        natural_scroll = false
    }
}

# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 0
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.active_border = rgb(11111B)
    #col.inactive_border = rgb(11111B)

    layout = dwindle
}

# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄
misc {
    disable_hyprland_logo = true # Disable logo on desktop
    disable_splash_rendering = true # Disable startup splashscreen
    
}

# █▀▄ █▀▀ █▀▀ █▀█ █▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▄▀ ██▄ █▄▄ █▄█ █▀▄ █▀█ ░█░ █ █▄█ █░▀█
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        vibrancy = 0.15
    }
    
    shadow {
        enabled = true
        range = 15
        render_power = 2
    }
}

# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█ █▀
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█ ▄█
animations {
    enabled=1 # Enable animations
    
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    #bezier=overshot,0.7,0.6,0.1,1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, default, slidevert
}

# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█
dwindle {
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

# █░█░█ █▀█ █▀█ █▄▀ █▀ █▀█ ▄▀█ █▀▀ █▀▀ █▀
# ▀▄▀▄▀ █▄█ █▀▄ █░█ ▄█ █▀▀ █▀█ █▄▄ ██▄ ▄█
#workspace=DP-3,1
#workspace=DP-2,2
#workspace=DP-2,3
#workspace=DP-2,4
#workspace=DP-2,5
#workspace=DP-2,6

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic-mouse-v1 {
    #sensitivity = -0.5
#}

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█
#windowrulev2 = fullscreen, class:^(rofi)$
#windowrule = match:class rofi, fullscreen
windowrule = match:class code, opacity 0.8 0.75
windowrule = match:class spotify, opacity 0.8 0.75
windowrule = match:class obsidian, opacity 0.8 0.75
windowrule = match:class brave-browser, opacity 0.8 0.75
windowrule = match:class jetbrains-idea, opacity 0.8 0.75
windowrule = match:class KeePass2, opacity 0.8 0.75
windowrule = match:class Postman, opacity 0.8 0.75
windowrule = match:class Kitty, opacity 0.8 0.75
# windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
# windowrulev2 = noanim,class:^(xwaylandvideobridge)$
# windowrulev2 = nofocus,class:^(xwaylandvideobridge)$
# windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$

windowrule = match:class nemo, float yes, size (monitor_w*0.65) (monitor_h*0.65), opacity 0.7 0.75

windowrule = match:class vlc, float yes, size (monitor_w*0.80) (monitor_h*0.80), opacity 0.8 0.75

windowrule = match:class brave, float yes, size (monitor_w*0.65) (monitor_h*0.65), opacity 0.8 0.75

windowrule = match:class org.gnome.Evince, float yes, size (monitor_w*0.80) (monitor_h*0.80), opacity 0.8 0.75

# windowrulev2 = float, class:^(org.gnome.Evince)$
# windowrulev2 = size 80% 80%, class:^(org.gnome.Evince)$
# windowrulev2 = center, class:^(org.gnome.Evince)$
# windowrulev2 = opacity 0.9 0.75, class:^(org.gnome.Evince)$

windowrule = match:class org.pulseaudio.pavucontrol, float yes, size (monitor_w*0.65) (monitor_h*0.65), opacity 0.8 0.75

windowrule = match:class xviewer, float yes, size (monitor_w*0.65) (monitor_h*0.65)

windowrule = match:class nwg-look, float yes, size (monitor_w*0.65) (monitor_h*0.65), opacity 0.8 0.75

# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █▀
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ ▄█
$mainMod = SUPER

# █▀ █▀▀ █▀█ █▀▀ █▀▀ █▄░█ █▀ █░█ █▀█ ▀█▀
# ▄█ █▄▄ █▀▄ ██▄ ██▄ █░▀█ ▄█ █▀█ █▄█ ░█░
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f - > /dev/null

# ▄▀█ █▀█ █▀█ █▀
# █▀█ █▀▀ █▀▀ ▄█
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, nemo
bind = $mainMod, M, exec, rofi -show drun
bind = $mainMod, C, exec, swaylock -i ~/Imágenes/wallpaper.png  --effect-blur 10x3 --indicator --clock
bind = $mainMod, B, exec, brave
bind = ALT, C, exec, code

# █░█ █▀█ █░░ █░█ █▀▄▀█ █▀▀
# ▀▄▀ █▄█ █▄▄ █▄█ █░▀░█ ██▄
bind =, XF86AudioRaiseVolume, exec, ~/.config/scripts/volume up
bind =, XF86AudioLowerVolume, exec, ~/.config/scripts/volume down
bind =, XF86AudioMute, exec, ~/.config/scripts/volume mute
bind =, XF86AudioPlay, exec, ~/.config/scripts/volume playpause

# █▄▄ █▀█ █ █▀▀ █░█ █▄░█ █▀▀ █▀ █▀
# █▄█ █▀▄ █ █▄█ █▀█ █░▀█ ██▄ ▄█ ▄█
bind =, XF86MonBrightnessUp, exec, ~/.config/scripts/brightness up
bind =, XF86MonBrightnessDown, exec, ~/.config/scripts/brightness down

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀▄▀█ ▄▀█ █▄░█ ▄▀█ █▀▀ █▀▄▀█ █▀▀ █▄░█ ▀█▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █░▀░█ █▀█ █░▀█ █▀█ █▄█ █░▀░█ ██▄ █░▀█ ░█░
bind = $mainMod, W, killactive, 
bind = $mainMod, F, togglefloating, 
bind = $mainMod, Space, fullscreen,
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
# bind = $mainMod ALT, Q, exit, 

# █▀▀ █▀█ █▀▀ █░█ █▀
# █▀░ █▄█ █▄▄ █▄█ ▄█
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = $mainMod ALT, H, movewindow, l
bind = $mainMod ALT, L, movewindow, r
bind = $mainMod ALT, K, movewindow, u
bind = $mainMod ALT, J, movewindow, d

# █▀█ █▀▀ █▀ █ ▀█ █▀▀
# █▀▄ ██▄ ▄█ █ █▄ ██▄
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, up, resizeactive, 0 -100
bind = $mainMod SHIFT, down, resizeactive, 0 100

# █▀ █░█░█ █ ▀█▀ █▀▀ █░█
# ▄█ ▀▄▀▄▀ █ ░█░ █▄▄ █▀█
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# █▀▄▀█ █▀█ █░█ █▀ █▀▀   █▄▄ █ █▄░█ █▀▄ █ █▄░█ █▀▀
# █░▀░█ █▄█ █▄█ ▄█ ██▄   █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# reload waybar
bind = $mainMod SHIFT, B, exec, killall -SIGUSR2 waybar
